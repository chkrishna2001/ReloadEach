name: Build VSIX

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract version from tag
      if: startsWith(github.ref, 'refs/tags/v')
      id: version
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        "VERSION=$version" >> $env:GITHUB_OUTPUT
        Write-Host "Version: $version"

    - name: Patch VSIX manifest version
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: |
        $manifest = "ReloadEach/source.extension.vsixmanifest"
        [xml]$xml = Get-Content $manifest
        $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
        $ns.AddNamespace("vsx", "http://schemas.microsoft.com/developer/vsx-schema/2011")
        $identity = $xml.SelectSingleNode("/vsx:PackageManifest/vsx:Metadata/vsx:Identity", $ns)
        $identity.Version = "${{ steps.version.outputs.VERSION }}"
        $xml.Save((Resolve-Path $manifest))
        Write-Host "Patched manifest to version ${{ steps.version.outputs.VERSION }}"

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore
      shell: pwsh
      run: dotnet restore ReloadEach.slnx

    - name: Build VSIX
      shell: pwsh
      run: dotnet build ReloadEach.slnx -c Release --no-restore

    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: ReloadEach-VSIX
        path: ReloadEach/bin/Release/ReloadEach.vsix

    - name: Check Marketplace secret
      if: startsWith(github.ref, 'refs/tags/v')
      id: marketplace
      shell: pwsh
      env:
        VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:VS_MARKETPLACE_PAT)) {
          "HAS_PAT=false" >> $env:GITHUB_OUTPUT
          Write-Host "VS_MARKETPLACE_PAT is not configured; skipping Marketplace publish."
        } else {
          "HAS_PAT=true" >> $env:GITHUB_OUTPUT
        }

    - name: Publish to Visual Studio Marketplace
      if: startsWith(github.ref, 'refs/tags/v') && steps.marketplace.outputs.HAS_PAT == 'true'
      shell: pwsh
      env:
        VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
      run: |
        $vsixPublisher = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -find **\VsixPublisher.exe | Select-Object -First 1
        if ([string]::IsNullOrWhiteSpace($vsixPublisher)) {
          throw "VsixPublisher.exe was not found."
        }

        & $vsixPublisher publish `
          -payload "ReloadEach/bin/Release/ReloadEach.vsix" `
          -publishManifest "publishManifest.json" `
          -personalAccessToken $env:VS_MARKETPLACE_PAT
